<ng-container *ngIf="displayMode === 'display'">
  <ng-container *ngIf="eventSelected">
<mat-card appearance="outlined" class="note-container">
  <mat-card-header>
    <mat-card-title>
      <div class="icon-container"><mat-icon>note_alt</mat-icon><div class="display-small">Notes</div></div>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="goal-text">{{eventSelected.note?.noteDescription || 'no notes added.'}}</div>
  </mat-card-content>
</mat-card>
</ng-container>
</ng-container>


<ng-container *ngIf="displayMode === 'edit'">
  <mat-card appearance="outlined" class="note-container">
    <mat-card-header>
      <mat-card-title>
        <div class="icon-container"><mat-icon>note_alt</mat-icon><div class="display-small">Notes</div></div>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
  <div [formGroup]="formGroup" class="note-field">
    <mat-form-field>
      <textarea matInput id="noteDescription" formControlName="noteDescription"></textarea>
    </mat-form-field>
  </div>
    </mat-card-content>
  </mat-card>
</ng-container>
