<ng-container *ngIf="showUserInfo; else defaultHome">
  <app-dashboard></app-dashboard>
</ng-container>


<ng-template #defaultHome>
<body class="bg-image">
  <video width="auto" height="auto" autoplay loop>
    <source src="ink_blob.mp4" type="video/mp4">
  </video>
  <div class="mask" style="background-color: rgba(0, 0, 0, 0.1);">
    <div class="d-flex flex-column justify-content-center align-items-center h-100">
      <img src="logo.svg" alt="Event visualizer logo" style="margin-bottom: 1.5rem;"/>
      <div class="d-flex w-100  justify-content-center align-items-center" style="margin: 0 auto;">
        <a href="https://honest-gobbler-26.accounts.dev/sign-in" class="btn-link">Sign in | Sign up</a>
        <button mat-stroked-button type="button" (click)="redirectToClerk('sign-in')" style="margin-right: 1rem; font-size: 20px; width: 300px;">Login</button>
        <button mat-stroked-button type="button" (click)="redirectToClerk('sign-up')" style="font-size: 20px; width: 300px;">Sign up</button>
      </div>
    </div>
  </div>
  <div id="app"></div>

  <!-- Initialize Clerk with your
  Clerk Publishable Key and Frontend API URL -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_aG9uZXN0LWdvYmJsZXItMjYuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://honest-gobbler-26.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <script>
    window.addEventListener('load', async function () {
      await Clerk.load()

      if (Clerk.user) {
        document.getElementById('app').innerHTML = `
        <div id="user-button"></div>
      `

        const userButtonDiv = document.getElementById('user-button')

        Clerk.mountUserButton(userButtonDiv)
      } else {
        document.getElementById('app').innerHTML = `
        <div id="sign-in"></div>
      `

        const signInDiv = document.getElementById('sign-in')

        Clerk.mountSignIn(signInDiv)
      }
    })
  </script>
</body>
</ng-template>
