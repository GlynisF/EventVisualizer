<div [formGroup]="formGroup">
  <div class="row">
    <div class="col">
      <mat-form-field class="full-width">
        <mat-label>Reflection</mat-label>
        <textarea matInput
                  id="reflection"
                  formControlName="reflectionDescription"
                  placeholder="A place for post-party thoughts."
                  rows="15">
              </textarea>
      </mat-form-field>
    </div>
  </div>
</div>
