<ng-container *ngIf="displayMode === 'display'">
<ng-container *ngIf="eventSelected">
  <mat-card appearance="outlined" class="goal-container">
    <mat-card-header>
      <mat-card-title>
        <div class="icon-container"><mat-icon>flag</mat-icon><h3>Goals</h3></div>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="goal-text">{{eventSelected.goal?.goalDescription || 'no goals added.'}}</div>
    </mat-card-content>
  </mat-card>
</ng-container>
</ng-container>


  <ng-container *ngIf="displayMode === 'edit'">
    <mat-card appearance="outlined" class="goal-container">
      <mat-card-header>
        <mat-card-title>
          <div class="icon-container"><mat-icon>flag</mat-icon><h3>Goals</h3></div>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
    <div [formGroup]="formGroup" class="goal-field">
      <mat-form-field>
        <textarea matInput formControlName="goalDescription"></textarea>
      </mat-form-field>
    </div>
      </mat-card-content>
    </mat-card>
  </ng-container>
