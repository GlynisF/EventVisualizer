<div [formGroup]="formGroup">
<div class="row">
  <div class="col">
    <mat-form-field class="full-width">
      <mat-label>Goals</mat-label>
      <textarea matInput formControlName="goalDescription"
                id="goal"
                rows="15"
                cols="100"
                placeholder="Jot down goals / hopes / dreams.">
          </textarea>
    </mat-form-field>
  </div>
</div>
</div>
