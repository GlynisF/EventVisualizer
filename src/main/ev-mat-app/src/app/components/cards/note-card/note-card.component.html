<mat-card appearance="outlined" class="note-container">
  <mat-card-header>
    <mat-card-title>
      <div class="icon-container"><mat-icon>note_alt</mat-icon><div class="display-small">Notes</div></div>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="goal-text">{{item.note.noteDescription || 'no notes added.'}}</div>
  </mat-card-content>
</mat-card>
