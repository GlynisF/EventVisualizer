# Define log directory
property.filename = /home/student/IdeaProjects/EventVisualizer/logs

# Append multiple loggers
appenders = console, file, rolling

# Console Appender
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

# File Appender
appender.file.type = File
appender.file.name = LOGFILE
appender.file.fileName=${filename}/ev.log
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

# RollingFile Appender
appender.rolling.type = RollingFile
appender.rolling.name = fileLogger
appender.rolling.fileName=${filename}/ev_rolling.log
appender.rolling.filePattern=${filename}/ev_rolling_%d{yyyy-MM-dd}-%i.log
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %level [%t] [%l] - %msg%n
appender.rolling.policies.type = Policies

# RollingFile rotation policy
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true

# Rollover strategy (delete old logs)
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.delete.type = Delete
appender.rolling.strategy.delete.basePath = ${filename}
appender.rolling.strategy.delete.maxDepth = 10
appender.rolling.strategy.delete.ifLastModified.type = IfLastModified
appender.rolling.strategy.delete.ifLastModified.age = 2d

# Loggers
logger.file.name = com.eventvisualizer
logger.file.level = error
logger.file.appenderRefs = fileLogger
logger.file.appenderRef.fileLogger.ref = fileLogger

rootLogger.level = error
rootLogger.appenderRefs = stdout, fileLogger
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.fileLogger.ref = fileLogger
